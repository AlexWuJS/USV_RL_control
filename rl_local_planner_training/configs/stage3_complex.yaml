# Stage 3b：复杂避障 —— 岸线走廊 + 窄通道 + 动态障碍 + 尺寸混合（从 3a best 续训）
#
# 场景构成（scene: mixed，每回合二选一）：
#   open_field：开阔场，3~10 个障碍（半数压路径）+ 0~3 动态 + 0~2 窄门
#   corridor  ：岸线走廊（净宽 8~25m），跟踪路径在走廊内曲折，
#               障碍压路径/近路摆放，动态障碍在走廊 bbox 内反弹
# 障碍尺寸混合（浮标 0.3~0.8 / 常规 1~3 / 码头·船 3~6）。
#
# 【在训练机执行】
#   python3 train/train_sac.py --config configs/stage3_complex.yaml \
#       --init-model models/stage3a/stage3_best/best_model.zip --out-dir models/stage3b
#   python3 evaluation/evaluate.py --config configs/stage3_complex.yaml \
#       --model models/stage3b/stage3_actor.pt --episodes 100 --plot
#
# 验收线：分场景统计（evaluate 输出 by_scene）——两种场景 collision=0、
#   总 success ≥85%、speed_mean ≥1.2。达标后才可上艇影子/水试。
stage: 3
total_timesteps: 2000000
seed: 2
n_envs: 8

env:
  dt: 0.1
  max_episode_steps: 700
  dynamics: first_order
  difficulty: hard
  scene: mixed                    # open_field | corridor | mixed
  corridor_mix_p: 0.5             # mixed 时取走廊的概率
  corridor_width_range: [8.0, 25.0]
  corridor_path_bias: 0.35
  n_obstacles: [3, 10]
  obstacle_on_path_frac: 0.5      # 半数障碍压路径
  obstacle_radius_ranges: [[0.3, 0.8], [1.0, 3.0], [3.0, 6.0]]
  n_moving_obstacles: [0, 3]
  narrow_gates: [0, 2]
  gate_gap_range: [3.5, 8.0]      # 窄门净宽逐门随机（旧行为为固定 4m）
  domain_randomization: true
  dr_ranges:
    tau_scale: [0.6, 1.4]
    r_max_scale: [0.8, 1.2]
    k_r_scale: [0.7, 1.3]
  use_speed_envelope: false
  control_delay_steps: [0, 2]
  obs_noise_std: 0.05
  sector_noise_std: 0.5
  sector_dropout: 0.10
  current_max: 0.3
  hull_radius: 0.6
  stuck_window_steps: 100
  stuck_min_progress: 0.5
  cte_abort: 10.0
  goal_radius: 1.5

  dynamics_params:
    tau_u: 0.79
    tau_r: 0.53
    tau_v: 0.5
    k_r: 0.8
    r_max: 0.6
    v_max_phys: 2.3

  reward:
    w_progress: 2.0
    w_track: 0.10
    w_heading: 0.05
    w_smooth: 0.30
    w_safe_speed: 0.5
    a_lat_max: 0.5
    obstacle: {far: 8.0, crawl: 3.0, critical: 1.5, gradient: 0.2, near: 0.5, hit: 2.0}
    terminal: {goal: 20.0, collision: -50.0, stuck: -20.0, timeout: -20.0, cte_abort: -10.0}

sac:
  learning_rate: 3.0e-4
  buffer_size: 500000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256]
  checkpoint_freq: 20000
  eval_freq: 10000
  n_eval_episodes: 20
