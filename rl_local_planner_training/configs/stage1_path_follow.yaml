# Stage 1：无障碍纯路径跟踪（RL_INTERFACE_DESIGN.md §8/§9 / 任务说明 §十四）
# 【在训练机执行】python3 train/train_sac.py --config configs/stage1_path_follow.yaml
stage: 1
total_timesteps: 500000
seed: 0
n_envs: 8

env:
  dt: 0.1
  max_episode_steps: 600          # 60s
  dynamics: first_order           # first_order | fossen
  difficulty: easy
  n_obstacles: 0
  n_moving_obstacles: 0
  narrow_gates: 0
  domain_randomization: false
  use_speed_envelope: false       # 训练期不启 supervisor 包络（部署端兜底）
  control_delay_steps: 0
  obs_noise_std: 0.0
  sector_noise_std: 0.0
  sector_dropout: 0.0
  current_max: 0.0
  hull_radius: 0.6                # 碰撞判定船体半径 m
  stuck_window_steps: 100         # 10s 无 0.5m 前进 → 停滞终止
  stuck_min_progress: 0.5
  cte_abort: 8.0
  goal_radius: 1.5

  dynamics_params:
    tau_u: 0.79
    tau_r: 0.53
    tau_v: 0.5
    k_r: 0.8
    r_max: 0.6
    v_max_phys: 2.3

  reward:
    w_progress: 4.0
    w_track: 1.00
    w_track_quad: 0.0
    w_track_deadband: 0.0
    w_track_deadband_min: 0.0
    w_heading: 0.15
    w_smooth: 0.30
    w_safe_speed: 0.5
    a_lat_max: 0.5
    obstacle: {far: 8.0, crawl: 3.0, critical: 1.5, gradient: 0.2, near: 0.5, hit: 2.0}
    terminal: {goal: 20.0, collision: -50.0, stuck: -20.0, timeout: -20.0, cte_abort: -10.0}

sac:
  learning_rate: 3.0e-4
  buffer_size: 500000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256]
  checkpoint_freq: 20000
  eval_freq: 10000
  n_eval_episodes: 20
