# Global costmap configuration
# 全局代价地图配置 - 参考pb_rm_simulation的实现

costmap:
  global_frame: map              # 全局坐标系（历史3D地图）
  robot_base_frame: body         # 机器人基座坐标系（FAST-LIO发布的body坐标系）
 
  update_frequency: 5.0          # 代价地图更新频率 (Hz)
  publish_frequency: 2.0         # 代价地图的发布频率 (Hz)
  transform_tolerance: 1.5       # 等待坐标变换发布信息的超时时间 (秒) - 增大以处理TF时间戳偏移
 
  static_map: true               # 使用静态地图（map_server的2D地图）
  rolling_window: false          # 不使用滚动窗口（固定在map坐标系）
  
  # 地图尺寸（如果static_map: true，会被实际地图覆盖）
  width: 100.0                   # 地图宽度 (m)
  height: 100.0                  # 地图高度 (m)
  resolution: 0.05               # 分辨率 (m/cell)
  
  # 插件配置（与pb_rm_simulation类似，但ROS1只支持layers而非plugins）
  plugins:
    - {name: static_layer,      type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,    type: "costmap_2d::VoxelLayer"}
    - {name: inflation_layer,   type: "costmap_2d::InflationLayer"}
  
  # 静态层配置
  static_layer:
    enabled: true
    map_topic: /prior_map        # 2D地图话题（map_server发布）