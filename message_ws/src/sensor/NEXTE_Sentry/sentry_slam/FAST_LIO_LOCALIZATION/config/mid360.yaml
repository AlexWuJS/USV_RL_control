common:
    lid_topic:  "/livox/lidar"    # LiDAR数据的ROS话题名称
    imu_topic:  "/livox/imu"      # IMU数据的ROS话题名称
    time_sync_en: false           # 时间同步开关，仅在无法进行外部时间同步时才开启
    time_offset_lidar_to_imu: 0.0 # LiDAR和IMU之间的时间偏移量校准值
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 4
    blind: 0.3                   # 盲区距离，单位为米   

mapping:
    acc_cov: 0.1                 # 加速度计噪声协方差
    gyr_cov: 0.1                 # 陀螺仪噪声协方差
    b_acc_cov: 0.0001            # 加速度计偏置噪声协方差
    b_gyr_cov: 0.0001            # 陀螺仪偏置噪声协方差
    fov_degree:    360           # 激光雷达的视场角，单位为度
    det_range:     100.0          # 激光雷达的检测距离，单位为米
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic # 是否启用IMU-LiDAR外参在线估计
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ] # 激光雷达相对于IMU的外参平移量  
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  true              # 是否启用路径发布
    scan_publish_en:  true       # false: close all the point cloud output  # 是否发布点云数据
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan. # 是否发布密集点云数据
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame # 是否发布IMU坐标系下的点云数据

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
                                 # -1表示所有帧保存在同一个文件中（注意：帧数过多可能导致内存崩溃）
